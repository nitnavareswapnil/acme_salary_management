spring.application.name=salary

# Credentials come from the environment; the defaults only suit local development.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/salary}
spring.datasource.username=${DB_USERNAME:salary}
spring.datasource.password=${DB_PASSWORD:salary}

# Flyway owns the schema; Hibernate only checks that entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
